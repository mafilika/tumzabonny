<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Admin | Tumza Bonny</title>
<link rel="stylesheet" href="css/style.css"><style>.p{max-width:760px;margin:30px auto;padding:24px;background:var(--card);border-top:5px solid var(--gold);border-radius:10px}label{display:block;font-weight:700;font-size:.82rem;margin:14px 0 4px}textarea{min-height:90px}</style></head><body>

<script src="js/content.js"></script><script>
// CHANGE THIS PASSCODE before uploading. Client-side only: it hides the page, it is not real security.
var PASS="tumza2026";
var F=[["phone","Phone number (shown on site)","+27 73 019 4559"],["wa","WhatsApp number, digits only","27730194559"],["email","Email","tumzabonny@gmail.com"],["address","Address","465 Old Location, Makeleketla, Winburg 9420, Free State"],["heroTitle","Homepage heading","Building, Plumbing & Supply Solutions You Can Trust in the Free State"],["heroText","Homepage intro text","NHBRC registered home builder and government supplier based in Winburg. Quality, professionalism and speed of delivery at competitive prices."],["about","About text","Tumza Bonny (Pty) Ltd is a B-BBEE Level 1 company registered with CIPC in 2019..."]];
